{% extends 'base.html' %}
{% block title_suffix %} · Start{% endblock %}
{% block content %}
<div class="panel" data-animate>
    <h2>Configure Your Quiz</h2>
    <form class="song-form" action="/start-quiz" method="post">
        <fieldset class="fieldset">
            <span class="legend">Song Set</span>
            <div class="radio-grid">
                {% for name in song_lists %}
                <div class="option">
                    <input type="radio" id="{{ name }}" name="song_list" value="{{ name }}" {% if name == default_song_list %}checked{% endif %} required>
                    <label for="{{ name }}">{{ name|replace('_',' ')|title }}</label>
                </div>
                {% endfor %}
            </div>
        </fieldset>

        <fieldset class="fieldset">
            <span class="legend">Year Range</span>
            <div class="range-inputs">
                <div class="control">
                    <label for="min_year">Minimum Year</label>
                    <input type="text" id="min_year" name="min_year" value="0" placeholder="e.g. 1980" />
                </div>
                <div class="control">
                    <label for="max_year">Maximum Year</label>
                        <input type="text" id="max_year" name="max_year" value="3000" placeholder="e.g. 2024" />
                </div>
            </div>
        </fieldset>

        <fieldset class="fieldset">
            <span class="legend">Other Options</span>
            <div class="inline">
                <input type="checkbox" id="repeats" name="repeats" value="repeats" />
                <label for="repeats">Allow repeats?</label>
            </div>
            <div class="inline">
                <input type="checkbox" id="local_audio" name="local_audio" value="local_audio" />
                <label for="local_audio">Play local audio files</label>
            </div>
            <div class="audio-settings" id="audio-settings">
                <div class="range-inputs">
                    <div class="control">
                        <label for="audio_duration">Audio Length (seconds)</label>
                        <input type="number" id="audio_duration" name="audio_duration" value="10" min="0.01" max="10" step="0.01" />
                    </div>
                    <div class="control">
                        <label for="playback_rate">Playback Rate</label>
                        <input type="number" id="playback_rate" name="playback_rate" value="1" min="0.25" max="4" step="0.05" />
                    </div>
                    <div class="control">
                        <label for="static_level">Static (0-100)</label>
                        <input type="number" id="static_level" name="static_level" value="0" min="0" max="100" step="1" />
                    </div>
                    <div class="control">
                        <label for="combine_count">Songs Together</label>
                        <input type="number" id="combine_count" name="combine_count" value="1" min="1" max="20" step="1" />
                    </div>
                </div>
                <div class="inline">
                    <input type="checkbox" id="play_reverse" name="play_reverse" value="play_reverse" />
                    <label for="play_reverse">Play backwards</label>
                </div>
            </div>
        </fieldset>

        <div>
            <button type="submit" class="primary">Start Song Quiz</button>
        </div>
    </form>
</div>
<script>
    const localAudio = document.getElementById('local_audio');
    const audioSettings = document.getElementById('audio-settings');
    const updateAudioSettings = () => { audioSettings.hidden = !localAudio.checked; };
    localAudio.addEventListener('change', updateAudioSettings);
    updateAudioSettings();
</script>
{% endblock %}
